name: Native CI

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-*.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK and app bundle
        env:
          MEMBER_OS_BASE_URL: https://app.antiaging-labs.com
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Upload Android debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antiaging-companion-android-debug-${{ github.sha }}
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 14
  ios-simulator:
    name: iOS simulator app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec native/ios/project.yml --project native/ios

      - name: Build unsigned simulator app
        run: >-
          xcodebuild
          -project native/ios/AntiagingCompanion.xcodeproj
          -scheme AntiagingCompanion
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath native/ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          MEMBER_OS_BASE_URL=https://app.antiaging-labs.com
          build

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent native/ios/DerivedData/Build/Products/Debug-iphonesimulator/AntiagingCompanion.app native/ios/AntiagingCompanion-simulator.zip

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: antiaging-companion-ios-simulator-${{ github.sha }}
          path: native/ios/AntiagingCompanion-simulator.zip
          if-no-files-found: error
          retention-days: 14
