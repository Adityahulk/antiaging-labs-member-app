name: Signed Native Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic app version, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android/iOS build number
        required: true
        type: number
      api_base_url:
        description: Production Member OS origin
        required: true
        default: https://app.antiaging-labs.com
        type: string

permissions:
  contents: read

concurrency:
  group: signed-native-release
  cancel-in-progress: false

jobs:
  android-release:
    name: Signed Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native/android
    env:
      APP_VERSION: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      MEMBER_OS_BASE_URL: ${{ inputs.api_base_url }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/native/android/release-upload.jks
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test "${MEMBER_OS_BASE_URL#https://}" != "$MEMBER_OS_BASE_URL"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: "8.11.1"

      - name: Build signed release
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: antiaging-companion-android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            native/android/app/build/outputs/apk/release/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  ios-release:
    name: Signed iOS IPA
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MEMBER_OS_BASE_URL: ${{ inputs.api_base_url }}
      APP_VERSION: ${{ inputs.version_name }}
      APP_BUILD_NUMBER: ${{ inputs.version_code }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release inputs
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test "${MEMBER_OS_BASE_URL#https://}" != "$MEMBER_OS_BASE_URL"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_KEYCHAIN_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$IOS_BUNDLE_ID"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate --spec native/ios/project.yml --project native/ios

      - name: Archive signed app
        run: >-
          xcodebuild
          -project native/ios/AntiagingCompanion.xcodeproj
          -scheme AntiagingCompanion
          -configuration Release
          -destination generic/platform=iOS
          -archivePath "$RUNNER_TEMP/AntiagingCompanion.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          MARKETING_VERSION="$APP_VERSION"
          CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER"
          MEMBER_OS_BASE_URL="$MEMBER_OS_BASE_URL"
          archive

      - name: Export IPA
        run: |
          cp native/ios/ExportOptions-AppStore.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Set :signingStyle manual' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AntiagingCompanion.xcarchive" -exportPath native/ios/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/AntiagingCompanion.xcarchive/dSYMs" native/ios/export/AntiagingCompanion-dSYMs.zip

      - name: Upload signed iOS release
        uses: actions/upload-artifact@v4
        with:
          name: antiaging-companion-ios-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            native/ios/export/*.ipa
            native/ios/export/AntiagingCompanion-dSYMs.zip
          if-no-files-found: error
          retention-days: 30
