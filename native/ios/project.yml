name: AntiagingCompanion
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MEMBER_OS_BASE_URL: "https://app.antiaging-labs.com"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AntiagingCompanion:
    type: application
    platform: iOS
    sources:
      - path: AntiagingCompanion
    info:
      path: AntiagingCompanion/Info.plist
    entitlements:
      path: AntiagingCompanion/AntiagingCompanion.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antiaginglabs.companion
        PRODUCT_NAME: AntiagingCompanion
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
      testTargets: []
